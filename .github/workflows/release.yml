name: Build installers

# Builds every distributable form of the ToLiss Photon installer:
#   * a per-platform bundle (photon-installer + its own-arch plugin + README),
#     one each for Windows / macOS / Linux
#   * an all-platforms zip bundling the three above into one download
#
# ⚠ ONE INSTALLER SHIPS, AND EACH BUNDLE CARRIES EXACTLY ONE EXECUTABLE. The
# frozen Python installer, the PyInstaller step that built it and the
# Python-Universal job that shipped it are all gone (docs/installer_cpp_plan.md
# §9/§10 decision 1), and so are `install.py`, `installer/` and the parity harness
# (deleted 2026-08-09). The install/uninstall/detect coverage they carried lives in
# `photoncore_tests` now — see src/native/tests/install_tests.cpp.
#
# ⚠ THE ONE EXECUTABLE IS THE **GUI** INSTALLER (2026-08-15). `PHOTON_GUI` is OFF
# by default — a contributor's checkout still builds with no Rust — so this
# workflow states `-DPHOTON_GUI=ON` explicitly, and that one flag is the whole
# difference between publishing the designed Slint front-end and publishing the
# terminal fallback. It went unstated from the GUI landing until 2026-08-15, and
# NOTHING FAILED: the job stayed green, the bundle was well-formed, and the only
# symptom was that the thing users double-clicked opened a console. Hence the
# `grep` tripwire on the configure log below — a silent downgrade to the TUI is
# not allowed to be a green run.
#
# Turning it ON is what adds a Rust toolchain (Slint's C++ API is a Rust library;
# there is no pure-C++ path) and, on Linux, a handful of system -dev packages.
# Both are installed per-runner below.
#
# The C++ toolchain cannot cross-compile, so each per-OS `build` job compiles its
# own .xpl and packs its own bundle on its own runner, and there is no longer any
# cross-job hand-off: the transient xpl-<arch> artifact existed only to let the
# `universal` job merge three arches into one fat plugin, and no bundle is fat any
# more. Every download carries the one arch its own runner built.
#
# The per-OS job is also where the TESTS run: photoncore_tests (C++), which now
# carries the install/uninstall/detect coverage, and the Python suite, which carries
# the DSL and the build tooling. Both are required steps — between them they are
# the whole net.
#
# Push a v* tag to also cut a GitHub Release with the three bundles attached; run
# manually (workflow_dispatch) to just produce the artifacts without releasing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed by the release job to create/attach to a Release

env:
  # X-Plane SDK download (see src/native/README.md). Fetched fresh each run;
  # SDK/ is gitignored (third-party), so CI grabs it the same way a dev does.
  XPSDK_URL: https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK411.zip

jobs:
  # ── per-OS: compile the .xpl AND build that platform's installer bundle ───────
  build:
    strategy:
      fail-fast: false
      # ⚠ `rust_targets` IS NOT BOILERPLATE ON macOS. CMakeLists asks for
      # `arm64;x86_64`, but cargo builds ONE architecture at a time — Corrosion
      # drives it once per arch and lipos the results, which it can only do if
      # rustc has BOTH std libraries. The runner is arm64, so `x86_64-apple-darwin`
      # is the one nobody has locally and the one CI must add; CMakeLists FATAL_ERRORs
      # on it rather than letting cargo fail deep inside a Slint build log.
      matrix:
        include:
          - { os: windows-latest, os_name: Windows, arch: win_x64, rust_targets: x86_64-pc-windows-msvc }
          - { os: macos-latest, os_name: macOS, arch: mac_x64, rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
          - { os: ubuntu-latest, os_name: Linux, arch: lin_x64, rust_targets: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ── the GUI's two extra prerequisites ────────────────────────────────────
      # ⚠ SLINT'S winit/FemtoVG BACKEND NEEDS THESE HEADERS AT BUILD TIME on Linux
      # and the runner image does not carry them. Without them the failure is a
      # pkg-config or cc error raised from inside a Rust build script, which names
      # a crate nobody here has heard of rather than a missing apt package.
      # fontconfig/freetype are the text stack; the xcb/xkbcommon/wayland set is
      # winit's two display backends; the mesa pair is what glutin makes its GL
      # context through.
      - name: Install Slint's Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev

      # ⚠ INSTALLED EXPLICITLY RATHER THAN TAKEN FROM THE IMAGE. The runners do
      # ship a Rust toolchain, but its version is theirs to change: Slint v1.17.1
      # declares `rust-version = "1.92"`, and an image that drifts below that
      # breaks the release build with an MSRV error on a tag push — the one run
      # nobody wants to debug. `stable` is deliberate: the *reproducibility* that
      # matters is pinned at the Slint tag (see CMakeLists), and pinning rustc too
      # would instead break the day a transitive crate needs something newer.
      - name: Install Rust (Slint v1.17.1 needs >= 1.92)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # Saves the crates.io downloads, not the Slint compile itself — Corrosion
      # builds that inside the CMake tree, which is not cached because a release
      # build has to be able to start from nothing. Keyed on CMakeLists because
      # that is where the Slint tag lives, so bumping the tag retires the cache.
      - name: Cache cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('src/native/CMakeLists.txt') }}
          restore-keys: cargo-${{ runner.os }}-

      # rustc's version belongs in the build cache's key: cargo fingerprints the
      # compiler, so a toolchain bump invalidates every artifact anyway. Keying on
      # it turns a guaranteed-useless restore into a clean miss.
      - name: Record the Rust version (for the build cache key)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: echo "RUSTC_V=$(rustc -V | tr -d ' ()' )" >> "$GITHUB_ENV"

      # ── the Slint COMPILE, cached for iteration runs only ────────────────────
      # ⚠ DELIBERATELY NOT ON TAG PUSHES. A published bundle is built from nothing;
      # that is a property worth more than the ~20 minutes this saves, because the
      # failure it prevents is unfalsifiable after the fact — a stale artifact
      # restored into a release binary leaves no trace in the artifact itself.
      # `workflow_dispatch` is the iteration loop, where the same commit gets built
      # repeatedly in one sitting and a hit is near-certain; `v*` is the release,
      # where a hit would be near-impossible anyway (GitHub evicts caches unused for
      # 7 days and tags are weeks apart) and would only buy a ~1-3 min upload of
      # something nothing reads.
      #
      # ⚠ THE PATH LOOKS WRONG AND IS NOT. Corrosion passes `--target-dir` outright,
      # so CARGO_TARGET_DIR is ignored, and it builds
      #   <build>/[<arch>/<config>/]cargo/.._<sha1-of-manifest-path>/
      # — one `cargo` glob covers the multi-config (Windows) and single-config
      # (Unix) layouts. The leaf starts with `..`, so it is invisible to `ls` and
      # skipped by most globs; matching the `cargo` DIRECTORY and letting tar
      # recurse is what actually captures it. ~1.4 GB on Windows, ~2x on macOS
      # (two arches), against a 10 GB per-repo limit shared with everything above.
      - name: Cache the Slint build (dispatch runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: src/native/build/**/cargo
          key: slintbuild-${{ runner.os }}-${{ env.RUSTC_V }}-${{ hashFiles('src/native/CMakeLists.txt') }}

      # unzip (Unix) preserves the macOS XPLM.framework symlinks the linker needs;
      # Expand-Archive (Windows) avoids relying on unzip being on PATH in Git Bash.
      - name: Fetch X-Plane SDK (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: src/native
        run: |
          curl -sSL -o sdk.zip "$XPSDK_URL"
          unzip -q sdk.zip
          rm sdk.zip
          test -f SDK/CHeaders/XPLM/XPLMDefs.h
      - name: Fetch X-Plane SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src/native
        run: |
          Invoke-WebRequest -Uri $env:XPSDK_URL -OutFile sdk.zip
          Expand-Archive -Path sdk.zip -DestinationPath . -Force
          Remove-Item sdk.zip
          if (-not (Test-Path SDK/CHeaders/XPLM/XPLMDefs.h)) { throw "unexpected SDK layout" }

      # Windows uses the multi-config VS generator (-A x64 + --config Release);
      # macOS/Linux use single-config (CMAKE_BUILD_TYPE). CMakeLists emits to
      # build/ToLissPhoton/<arch>/ToLissPhoton.xpl for all three.
      #
      # ⚠ ONE TREE, UNLIKE A DEV MACHINE. run-installer.ps1 keeps build-gui/ and
      # build-core/ on PHOTON_CORE_ONLY so installer work needs no X-Plane SDK, and
      # the .xpl in its own build/ so plugin work needs no Rust. A runner has both
      # and is thrown away afterwards, so splitting the trees here would only
      # compile photoncore twice.
      #
      # ⚠ PHOTON_GUI IS STATED, NEVER LEFT TO THE CACHE — the same rule deploy.ps1
      # and run-installer.ps1 follow for PHOTON_DEV and PHOTON_GUI, and the reason
      # is sharper here: the default is OFF, so an omitted flag does not fall back
      # to the old behavior, it silently publishes the wrong front-end.
      - name: Configure & build plugin + GUI installer (Release)
        shell: bash
        working-directory: src/native
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -A x64 -DPHOTON_GUI=ON 2>&1 | tee configure.log
            cmake --build build --config Release
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPHOTON_GUI=ON 2>&1 | tee configure.log
            cmake --build build
          fi
          test -f "build/ToLissPhoton/${{ matrix.arch }}/ToLissPhoton.xpl"

          # ⚠ THE TRIPWIRE. `option()` is a no-op against a cached value and a
          # typo'd -D is simply ignored, so "we passed the flag" is not evidence
          # the GUI is in. CMakeLists prints this line only from inside
          # `if(PHOTON_GUI)`; matching it is the one check that fails a build
          # which would otherwise pack a perfectly working terminal installer
          # into a bundle labelled as the GUI.
          grep -q "GUI build - photon-installer links Slint" configure.log || {
            echo "::error::PHOTON_GUI did not take effect - this build would ship the TUI installer"
            exit 1
          }

      # One `cmake --build` already produced all four targets — the .xpl, the
      # photoncore static lib, photoncore_tests and photon-installer. This step
      # only locates the two executables (multi-config VS puts them under
      # Release/, single-config does not) and REFUSES TO CONTINUE if either is
      # missing.
      #
      # ⚠ THAT REFUSAL IS THE POINT. Everything downstream — the tests AND the
      # bundle — needs these two binaries, and a job that quietly carried on would
      # either skip the suite or publish a download with nothing to run in it.
      - name: Locate the compiled installer + core tests
        id: native
        shell: bash
        working-directory: src/native
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe="$PWD/build/Release/photon-installer.exe"
            tests="$PWD/build/Release/photoncore_tests.exe"
          else
            exe="$PWD/build/photon-installer"
            tests="$PWD/build/photoncore_tests"
          fi
          test -x "$exe"   || { echo "::error::photon-installer was not built at $exe"; exit 1; }
          test -x "$tests" || { echo "::error::photoncore_tests was not built at $tests"; exit 1; }
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      - name: Run photoncore tests (C++)
        shell: bash
        run: "${{ steps.native.outputs.tests }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The stdlib-unittest suite: the DSL, the OBJ emitter, the plugin's source
      # contracts and the build tooling. The installer's own coverage is in
      # photoncore_tests above, which is why THAT step is not optional either.
      - name: Run the Python suite (DSL, emitter, build tooling)
        shell: bash
        run: python -m unittest discover -s tests

      # Build the payload with THIS platform's arch only and pack the bundle, in
      # one step: --bundle stages photon-installer + data/ + README.txt and picks
      # zip/tar.gz per OS. Python is here for the BUILD TOOLING (the DSL emits the
      # OBJs) — it is not a runtime or install-time dependency of what ships.
      - name: Build platform bundle (own arch)
        run: python build/make_release.py --plugin-dir src/native/build/ToLissPhoton --bundle

      - name: Upload platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os_name }}
          path: |
            release/ToLissPhoton-Installer-v*-${{ matrix.os_name }}.zip
            release/ToLissPhoton-Installer-v*-${{ matrix.os_name }}.tar.gz
          if-no-files-found: error

  # ── the all-platforms zip: the three bundles in one download ──────────────────
  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download the three platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundles
      - name: Assemble all-platforms zip
        run: python build/make_allzip.py --archives bundles
      - uses: actions/upload-artifact@v4
        with:
          name: all-platforms
          path: release/ToLissPhoton-Installer-v*-All-Platforms.zip
          if-no-files-found: error

  # ── attach the three bundles to a GitHub Release (tag pushes only) ────────────
  release:
    needs: collect
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download the three platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      - name: List assets
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
