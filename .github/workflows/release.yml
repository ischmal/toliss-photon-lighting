name: Build installers

# Builds every distributable form of the ToLiss Photon installer:
#   * a per-platform bundle (installer binary + its own-arch plugin + README),
#     one each for Windows / macOS / Linux
#   * a Python-Universal bundle (readable .py, runs on any OS, fat plugin)
#   * an all-platforms zip bundling the four above into one download
#
# The C++ plugin and PyInstaller both cannot cross-compile, so each per-OS
# `build` job compiles its own .xpl AND freezes its own installer on its own
# runner. The only cross-job hand-off is the compiled .xpl (uploaded as a short-
# lived xpl-<arch> artifact) which the `universal` job merges into a fat plugin.
#
# Push a v* tag to also cut a GitHub Release with the four bundles attached; run
# manually (workflow_dispatch) to just produce the artifacts without releasing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed by the release job to create/attach to a Release

env:
  # X-Plane SDK download (see src/native/README.md). Fetched fresh each run;
  # SDK/ is gitignored (third-party), so CI grabs it the same way a dev does.
  XPSDK_URL: https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK411.zip

jobs:
  # ── per-OS: compile the .xpl AND build that platform's installer bundle ───────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, os_name: Windows, arch: win_x64 }
          - { os: macos-latest, os_name: macOS, arch: mac_x64 }
          - { os: ubuntu-latest, os_name: Linux, arch: lin_x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # unzip (Unix) preserves the macOS XPLM.framework symlinks the linker needs;
      # Expand-Archive (Windows) avoids relying on unzip being on PATH in Git Bash.
      - name: Fetch X-Plane SDK (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: src/native
        run: |
          curl -sSL -o sdk.zip "$XPSDK_URL"
          unzip -q sdk.zip
          rm sdk.zip
          test -f SDK/CHeaders/XPLM/XPLMDefs.h
      - name: Fetch X-Plane SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src/native
        run: |
          Invoke-WebRequest -Uri $env:XPSDK_URL -OutFile sdk.zip
          Expand-Archive -Path sdk.zip -DestinationPath . -Force
          Remove-Item sdk.zip
          if (-not (Test-Path SDK/CHeaders/XPLM/XPLMDefs.h)) { throw "unexpected SDK layout" }

      # Windows uses the multi-config VS generator (-A x64 + --config Release);
      # macOS/Linux use single-config (CMAKE_BUILD_TYPE). CMakeLists emits to
      # build/ToLissPhoton/<arch>/ToLissPhoton.xpl for all three.
      - name: Configure & build plugin (Release)
        shell: bash
        working-directory: src/native
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -A x64
            cmake --build build --config Release
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build
          fi
          test -f "build/ToLissPhoton/${{ matrix.arch }}/ToLissPhoton.xpl"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      # Build the payload with THIS platform's arch only, then freeze the loose
      # installer and pack the platform bundle (make_exe picks zip/tar.gz per OS).
      - name: Build platform payload (own arch)
        run: python build/make_release.py --plugin-dir src/native/build/ToLissPhoton
      - name: Build platform bundle
        run: python build/make_exe.py --skip-release

      - name: Upload platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os_name }}
          path: |
            release/ToLissPhoton-Installer-v*-${{ matrix.os_name }}.zip
            release/ToLissPhoton-Installer-v*-${{ matrix.os_name }}.tar.gz
          if-no-files-found: error

      # Short-lived hand-off: the compiled .xpl, so the universal job can merge
      # all three arches into one fat plugin. Not a deliverable — expires fast.
      - name: Upload compiled plugin (transient)
        uses: actions/upload-artifact@v4
        with:
          name: xpl-${{ matrix.arch }}
          path: src/native/build/ToLissPhoton # -> <arch>/ToLissPhoton.xpl
          retention-days: 1
          if-no-files-found: error

  # ── the Python-Universal bundle (fat plugin, all arches; build once) ──────────
  universal:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download + merge compiled plugins (all arches)
        uses: actions/download-artifact@v4
        with:
          pattern: xpl-*
          merge-multiple: true
          path: plugin # -> plugin/<arch>/ToLissPhoton.xpl
      - name: Build Python-Universal bundle
        run: python build/make_release.py --plugin-dir plugin --zip
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-Python-Universal
          path: release/ToLissPhoton-Installer-v*-Python-Universal.zip
          if-no-files-found: error

  # ── the all-platforms zip: the four bundles in one download ───────────────────
  collect:
    needs: [build, universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download the four platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundles
      - name: Assemble all-platforms zip
        run: python build/make_allzip.py --archives bundles
      - uses: actions/upload-artifact@v4
        with:
          name: all-platforms
          path: release/ToLissPhoton-Installer-v*-All-Platforms.zip
          if-no-files-found: error

  # ── attach the four bundles to a GitHub Release (tag pushes only) ─────────────
  release:
    needs: collect
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download the four platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      - name: List assets
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
